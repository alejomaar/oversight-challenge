version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kb_rag_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/vectorstore:/app/vectorstore
      - ./backend/uploads:/app/uploads
    restart: unless-stopped
    networks:
      - kb_rag_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kb_rag_frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - kb_rag_network

networks:
  kb_rag_network:
    driver: bridge

