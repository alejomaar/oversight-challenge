version: '3.8'

services:
  pgvector:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: kb_rag_pgvector
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag_db
    volumes:
      - pgvector_data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - kb_rag_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kb_rag_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://rag_user:rag_password@pgvector:5432/rag_db
    depends_on:
      - pgvector
    restart: unless-stopped
    networks:
      - kb_rag_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kb_rag_frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - kb_rag_network

volumes:
  pgvector_data:

networks:
  kb_rag_network:
    driver: bridge

